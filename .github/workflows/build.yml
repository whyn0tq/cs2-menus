name: Build AMBuild Plugin

on:
  push:
    branches:
      - main
    tags:
      - '*.*.*'
  pull_request:
    branches:
      - main
  release:
    types:
      - created
  workflow_dispatch:
    inputs:
      release_tag:
        description: Build an existing tag and attach its archive to the release
        required: false
        type: string

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: write
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/alliedmodders/build-containers/debian11-clang22:latest

    env:
      MMS_VERSION: "2.0.0.1483"
      HL2SDK_ROOT: "${{ github.workspace }}/external"
      MMS_PATH: "${{ github.workspace }}/external/metamod-source"
      MANIFEST_PATH: "${{ github.workspace }}/external/metamod-source/hl2sdk-manifests"

    steps:
      - name: Generate build number
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: buildnumber
        uses: onyxmueller/build-tag-number@v1
        with:
          token: ${{secrets.github_token}}

      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up dependencies
        run: |
          mkdir -p external
          cd external
          git clone --recursive --depth 1 --branch $MMS_VERSION \
            https://github.com/alliedmodders/metamod-source.git
          git clone --recursive --depth 1 --branch cs2 --single-branch \
            https://github.com/alliedmodders/s2sdk.git hl2sdk-cs2
            
          cd ../..

          git clone https://github.com/${{ github.repository_owner }}/SchemaEntity.git
          
      - name: Test SchemaEntity
        run: |
          "${CXX:-clang++}" -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I../SchemaEntity ../SchemaEntity/tests/pattern_test.cpp -o /tmp/schema-pattern-tests
          /tmp/schema-pattern-tests

      - name: Test menu callbacks
        run: |
          "${CXX:-clang++}" -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I. tests/menu_callback_test.cpp -o /tmp/menu-callback-tests
          /tmp/menu-callback-tests

      - name: Configure and build plugin
        run: |
          mkdir build
          cd build
          python3 ../configure.py -s cs2 --targets x86_64 --enable-optimize --hl2sdk-manifests=$MANIFEST_PATH --mms_path=$MMS_PATH --hl2sdk-root=$HL2SDK_ROOT
          ambuild

      - name: Package addon into ZIP
        run: |
          cd build/package
          python3 -m zipfile -c "${GITHUB_WORKSPACE}/${{ github.event.repository.name }}.zip" addons

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}
          path: build/package/addons

      - name: Attach ZIP to release
        if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: ${{ github.workspace }}/${{ github.event.repository.name }}.zip
